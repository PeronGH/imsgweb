name: CI

on:
  push:
    branches: [main]

# serialize runs so two pushes can't race the tag increment
concurrency:
  group: ci-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bun run check
      - run: bun run lint
      - run: bun test

      - name: Install imsg
        run: brew install steipete/tap/imsg

      - name: Build with embedded imsg
        run: IMSGWEB_EMBED_IMSG="$(brew --prefix imsg)/libexec/imsg" bun run build

      - uses: actions/upload-artifact@v4
        with:
          name: imsgweb
          path: dist/imsgweb
          if-no-files-found: error

  # releasing runs on ubuntu: the macos-26 beta image showed intermittent
  # 401s from gh against api.github.com (runs 27288482151 / 27288573488)
  release:
    needs: build
    runs-on: ubuntu-slim
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # all refs, so existing v* tags are visible for the increment
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: imsgweb
          path: dist

      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(git tag --list 'v*' | grep -E '^v[0-9]+$' | sed 's/^v//' | sort -n | tail -1 || true)
          next="v$(( ${latest:-0} + 1 ))"
          echo "Releasing $next"
          gh release create "$next" dist/imsgweb --title "$next" --generate-notes --target "$GITHUB_SHA"
